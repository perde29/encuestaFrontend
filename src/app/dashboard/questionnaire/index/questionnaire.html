<div class="wrapper">
  <app-nav></app-nav>
  <div class="main">
    <app-header [usuario]="usuario"></app-header>
    <main class="content">
      <div class="container-fluid p-0">
        <h1 class="h3 mb-3"><strong>Cuestionario:</strong></h1>
        <!-- Contenido del cuestionario -->
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-body">
                <!-- <p>Aquí va el contenido del cuestionario.</p>  -->
                <table class="table">
                  <thead class="table-light">
                    <tr>
                      <th scope="col">#</th>
                      <th scope="col">Sector</th>
                      <th scope="col">Estado</th>
                      <th scope="col"></th>
                    </tr>
                  </thead>
                  <tbody>
                    @for (item of questionnaireList; track $index) {
                      <tr class="questionnaire{{ item.id }}">
                        <th scope="row">{{ $index + 1 }}</th>
                        <td>{{ item.title }}</td>
                        <td>{{ item.state }}</td>
                        <td>
                          <a
                            style="color: black"
                            [routerLink]="[
                              '/dashboard/questionnaire/preview',
                              item.id,
                            ]"
                          >
                            Pre Visualizar
                          </a>
                        </td>
                      </tr>
                    }
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
